<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./assets/images/favicon-32x32.png" />

        <title>Frontend Mentor | Social links profile</title>
        <link rel="stylesheet" href="./css/style.css" />
    </head>
    <body>
        <main class="container">
            <article class="social-card flex-col">
                <img
                    class="social-card--image"
                    src="./assets/images/avatar-koosha.jpg"
                    alt="koosha barooni's profile picture" />
                <div class="social-card--identity flex-col">
                    <h1 class="social-card--name">Koosha Barooni</h1>
                    <p class="social-card--location">Karaj, Iran</p>
                </div>
                <p class="social-card--job-title">"Front-end Developer"</p>
                <div class="social-card--links flex-col">
                    <a
                        href="https://github.com/koosha-barooni"
                        class="social-card--link"
                        >Github</a
                    >
                    <a
                        href="https://www.frontendmentor.io/profile/koosha-barooni"
                        class="social-card--link"
                        >Frontend Mentor</a
                    >
                    <a
                        href="https://www.linkedin.com/in/koosha-barooni/"
                        class="social-card--link"
                        >LinkedIn</a
                    >
                    <a
                        href="https://x.com/kousha_barooni"
                        class="social-card--link"
                        >X</a
                    >
                    <a
                        href="https://t.me/koosha_barooni"
                        class="social-card--link"
                        >Telegram</a
                    >
                </div>
            </article>
        </main>
    </body>
</html>
