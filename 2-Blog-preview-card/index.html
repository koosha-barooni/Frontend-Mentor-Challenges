<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./assets/images/favicon-32x32.png" />

        <title>Frontend Mentor | Blog preview card</title>

        <link rel="stylesheet" href="./css/style.css" />
    </head>
    <body>
        <main>
            <article class="blog-card">
                <img
                    class="blog-card--image"
                    src="./assets/images/illustration-article.svg"
                    alt="illustration for blog article card" />
                <div class="blog-card--content">
                    <span class="blog-card--tag">Learning</span>
                    <p class="blog-card--publish-date">Published 21 Dec 2023</p>
                    <h1 class="blog-card--heading">
                        <a href="#">HTML & CSS foundations</a>
                    </h1>
                    <p class="blog-card--description">
                        These languages are the backbone of every website,
                        defining structure, content, and presentation.
                    </p>
                </div>
                <div class="blog-card--author">
                    <img
                        class="blog-card--author-image"
                        src="./assets/images/image-avatar.webp"
                        alt="Greg Hooper's photo, author of this article" />
                    <p class="blog-card--author-name">Greg Hooper</p>
                </div>
            </article>
        </main>

        <footer class="attribution">
            Challenge by
            <a href="https://www.frontendmentor.io?ref=challenge"
                >Frontend Mentor</a
            >. Coded by <a href="#">Your Name Here</a>.
        </footer>
    </body>
</html>
